name: MoonBit CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show toolchain version
        run: moon version
      - name: Check formatting
        run: |
          moon fmt
          git diff --exit-code
      - name: Type check
        run: moon check
      - name: Build browser JavaScript backend
        run: moon build --target js web_api
      - name: Smoke test browser API export
        run: node web_api/smoke.mjs
      - name: Build static Web Lab
        run: node scripts/build-web.mjs
      - name: Smoke test built Web Lab
        run: node scripts/site-smoke.mjs
      - name: Check browser JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/simulation-worker.js
          node --check scripts/build-web.mjs
          node --check scripts/site-smoke.mjs
          node --check scripts/browser-smoke.mjs
      - name: Run tests
        run: moon test
      - name: Run examples
        run: |
          moon run examples/basic_queue
          moon run examples/manufacturing_line
          moon run examples/logistics_batching

  browser-e2e:
    name: Browser E2E (Chromium)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Build Web Lab
        run: |
          moon build --target js web_api
          node scripts/build-web.mjs
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Chromium Web Lab tests
        run: npm run test:browser

  browser-e2e-firefox:
    name: Browser E2E (Firefox, advisory)
    continue-on-error: true
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Build Web Lab
        run: |
          moon build --target js web_api
          node scripts/build-web.mjs
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Firefox
        run: npx playwright install --with-deps firefox
      - name: Run Firefox Web Lab tests
        run: npm run test:browser:firefox

  deploy-pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [validate, browser-e2e]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Build browser JavaScript backend
        run: moon build --target js web_api
      - name: Build static Web Lab
        run: node scripts/build-web.mjs
      - name: Smoke test deployed files
        run: node scripts/site-smoke.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
