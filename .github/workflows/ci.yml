name: MoonBit CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show toolchain version
        run: moon version
      - name: Check formatting
        run: |
          moon fmt
          git diff --exit-code
      - name: Type check
        run: moon check
      - name: Build browser JavaScript backend
        run: moon build --target js web_api
      - name: Smoke test browser API export
        run: node web_api/smoke.mjs
      - name: Run tests
        run: moon test
      - name: Run examples
        run: |
          moon run examples/basic_queue
          moon run examples/manufacturing_line
          moon run examples/logistics_batching
