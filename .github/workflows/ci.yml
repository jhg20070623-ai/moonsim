name: MoonBit CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show toolchain version
        run: moon version
      - name: Check formatting
        run: |
          moon fmt
          git diff --exit-code
      - name: Type check
        run: moon check
      - name: Run tests
        run: moon test
